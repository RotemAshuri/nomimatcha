.jp{font-family:var(--jp)}
.it{font-style:italic; font-weight:700; letter-spacing:-.045em}
.it .jp{font-style:normal; font-weight:700; letter-spacing:0}
.bx{display:block; flex:none; aspect-ratio:315/560; background:var(--img) no-repeat 50% 100% / contain}
.cmp3 .chd{display:inline-flex; align-items:center; gap:10px; margin:0 0 14px; font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase}
.cmp3 .chd b{display:grid; place-items:center; min-width:62px; height:24px; padding-inline:8px; background:var(--ink); color:var(--paper); border-radius:2px; font-size:12px}
.cmp3 .chd .jp{font-size:15px; letter-spacing:.04em}
.cmp3 .sh{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:28px; padding-bottom:22px; border-bottom:1.5px solid var(--ink)}
.cmp3 .sh h2{margin:0; font-size:clamp(40px,5.2vw,88px); line-height:.95; letter-spacing:-.04em}
.cmp3 .sh p{margin:12px 0 0; max-width:48ch; font-size:16px; line-height:1.45}
.cmp3 .sh .why{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.7; max-width:34ch; line-height:1.5}
.cmp3 .ty{display:inline-flex; align-items:center; gap:6px; height:24px; padding-inline:8px; border:1.5px solid var(--pc); color:var(--pc); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; line-height:1; white-space:nowrap}
.cmp3 .ty .jp{font-size:13px; letter-spacing:.04em}
.cmp3 .ty.k{background:var(--pc); color:var(--paper)}
.cmp3 .meter{position:relative; display:block; width:100%; max-width:110px; height:8px}
.cmp3 .meter::before{content:""; position:absolute; inset-inline:0; top:50%; height:1.5px; margin-top:-.75px; background:currentColor; opacity:.4}
.cmp3 .meter i{position:absolute; inset-inline-start:0; top:50%; height:3px; margin-top:-1.5px; width:calc(var(--lv) * 20%); background:currentColor}
.cmp3 .meter b{position:absolute; top:0; inset-inline-start:calc(var(--lv) * 20% - 4px); width:8px; height:8px; border-radius:50%; background:currentColor}
.cmp3 .mv{display:flex; align-items:center; gap:10px; color:var(--pc)}
.cmp3 .mv .meter{flex:1 1 60px; min-width:50px; width:auto}
.cmp3 .mv .n{font-size:14px; font-weight:700; min-width:22px}
.cmp3 .pickb{display:inline-flex; align-items:center; gap:8px; height:32px; padding-inline:8px 12px; border:1.5px solid currentColor; font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:inherit; transition:background-color .2s,color .2s}
.cmp3 .pickb i{position:relative; width:16px; height:16px; border:1.5px solid currentColor}
.cmp3 .pickb[aria-pressed=true]{background:var(--paper); color:var(--ink); border-color:var(--paper)}
.cmp3 .pickb[aria-pressed=true] i{background:var(--ink)}
.cmp3 .pickb[aria-pressed=true] i::after{content:""; position:absolute; left:3px; top:1px; width:7px; height:4px; border:solid var(--paper); border-width:0 0 2.5px 2.5px; transform:rotate(-45deg)}
.cmp3 .ab{display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--paper); color:var(--ink); border:1.5px solid var(--ink); font-size:13px; font-weight:700}
.cmp3 .rt3{position:relative; display:flex; justify-content:space-between; margin:14px 4% 34px}
.cmp3 .rt3::before{content:""; position:absolute; inset-inline:0; top:21px; height:10px; background:var(--ink)}
.cmp3 .rt3 button{--pc:var(--ink); position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:10px; width:22%; text-align:center}
.cmp3 .rt3 .ring{display:grid; place-items:center; width:42px; height:42px; border-radius:50%; border:8px solid var(--pc); background:var(--paper); box-shadow:0 0 0 1.5px var(--ink); transition:background-color .25s}
.cmp3 .rt3 button[aria-pressed=true] .ring{background:var(--pc)} .rt3 button[aria-pressed=true] .ring::after{content:attr(data-l); color:var(--paper); font-size:13px; font-weight:700}
.cmp3 .rt3 .nm{font-size:clamp(16px,1.6vw,22px); line-height:1.05; color:var(--pc)} .rt3 small{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; opacity:.7}
.cmp3 .duel{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,2vw,28px); margin-bottom:34px}
.cmp3 .duel .tk{--pc:var(--ink); background:var(--paper); border:1.5px solid var(--ink)}
.cmp3 .duel .tk .hh{display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--pc); color:var(--paper)}
.cmp3 .duel .tk .hh .bx{height:84px} .duel .tk .hh .nm{font-size:clamp(22px,2.2vw,32px); line-height:1}
.cmp3 .duel .tk .ln{display:flex; align-items:baseline; gap:8px; padding:9px 16px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.cmp3 .duel .tk .ln::after{content:""; order:1; flex:1; border-bottom:2px dotted color-mix(in srgb,var(--ink) 40%,transparent); transform:translateY(-3px)}
.cmp3 .duel .tk .ln span{order:2; font-size:14px; font-weight:500; letter-spacing:0; text-transform:none; text-align:end}
.cmp3 .duel .tk .ln.win span{font-weight:700; color:var(--pc)}
.cmp3 .duel .tk .gq{padding:7px 16px; background:var(--paper-muted); border-block:1.5px solid var(--ink); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
.cmp3 .full3{border:1.5px solid var(--ink); background:var(--paper)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

/* page frame of the options sheet */
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; padding:34px var(--gutter) 22px; border-bottom:1.5px solid var(--ink); background:var(--paper)}

.ph b{display:grid; place-items:center; min-width:62px; height:24px; padding-inline:8px; background:var(--ink); color:var(--paper); border-radius:2px; font-size:12px; letter-spacing:.1em}
.ph h2{font-size:clamp(28px,3.4vw,48px); line-height:1}
.part>.pd{max-width:70ch; margin:8px 0 30px; font-size:15px; color:var(--ink-muted)}
.fr{margin:0 0 54px}
.lab{display:flex; align-items:baseline; gap:12px; margin:0 0 10px}
.lab b{display:grid; place-items:center; min-width:34px; height:26px; padding-inline:8px; background:var(--matcha); color:var(--paper); border-radius:2px; font-size:13px}
.lab h3{font-size:22px; line-height:1}
.lab span{font-size:14px; color:var(--ink-muted)}
.stage{background:var(--paper-muted); border:1.5px solid var(--ink)}

.cta{display:inline-flex; align-items:center; gap:12px; height:52px; padding-inline:22px; background:var(--ink); color:var(--paper); border:1.5px solid var(--ink); border-radius:2px; font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap}

.cta.inv{background:var(--paper); color:var(--ink); border-color:var(--paper)}

.kk .jp{font-size:15px; letter-spacing:.04em}
.kk.inv b{background:var(--paper); color:var(--ink)}

/* T1: two tins, one question */
.t1{display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(24px,5vw,80px); align-items:center; padding:clamp(28px,4vw,56px)}

.pair::before{content:""; position:absolute; inset-inline:12%; top:30px; height:10px; background:var(--ink)}
.pair .pt{position:relative; display:flex; flex-direction:column; align-items:center; gap:14px}
.ring{display:grid; place-items:center; width:48px; height:48px; border-radius:50%; border:8px solid var(--ink); background:var(--paper-muted); font-size:15px; font-weight:700; line-height:1}

/* T2: the line preview */
.t2{padding:clamp(28px,4vw,52px)}

.route::before{content:""; position:absolute; inset-inline:0; top:23px; height:10px; background:var(--ink)}

/* T3: a peek at the table */
.t3{padding:clamp(28px,4vw,52px) clamp(28px,4vw,52px) 0}
.t3 .hd{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:26px}

.peek{background:var(--paper); border:1.5px solid var(--ink); border-bottom:0}
.peek .rw{display:grid; grid-template-columns:19% repeat(4,1fr); align-items:center}

.mt{position:relative; display:block; flex:1; min-width:40px; max-width:110px; height:8px}

.band{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:16px 22px; background:var(--ink); color:var(--paper); margin-inline:calc(-1 * clamp(28px,4vw,52px))}

function chead(){return '<div class="sh"><div><p class="chd"><b>NM 05</b><span class="jp">比較</span><span>Compare</span></p><h2 class="it">Compare Our Matcha</h2><p>Pick two matchas on the line to put them side by side, or read the whole table.</p></div></div>'}

function cmpHTML(){
  var rt='<div class="rt3">'+CP.map(function(p){var l=cletter(p.id); return '<button type="button" data-cpick="'+p.id+'" aria-pressed="'+!!l+'" style="--pc:'+COL[p.c]+'"><span class="ring" data-l="'+l+'"></span><span class="nm it">'+p.n+'</span><small>'+CTYN[p.ty][1]+' '+CTYN[p.ty][0]+'</small></button>'}).join('')+'</div>';
  var d='';
  if(CS.sel.length===2){ var a=cbyId(CS.sel[0]), b=cbyId(CS.sel[1]); d='<div class="duel">'+[a,b].map(function(p,i){var o=i?a:b; return '<div class="tk" style="--pc:'+COL[p.c]+'"><div class="hh">'+cbx(p.box)+'<div><h3 class="nm it" style="margin:0">'+p.n+'</h3><small style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">'+p.kj+' · '+p.tr+'</small></div></div>'+CATTR.map(function(t){ if(t[0]==='g') return '<div class="gq">'+t[1]+'</div>'; var w=i?cwin(t,a,b)===2:cwin(t,a,b)===1; return '<div class="ln'+(w?' win':'')+'"><b>'+t[1]+'</b><span>'+(t[2]==='chip'?CTYN[p.ty][1]+' '+CTYN[p.ty][0]:(t[2]==='meter'?t[3](p)+' / 5':t[3](p)))+'</span></div>'}).join('')+'</div>'}).join('')+'</div>'; }
  else d='<p style="font-size:15px;margin-bottom:30px">Pick two stations on the line.</p>';
  var tb='<details class="full3"'+(CS.open?' open':'')+'><summary>The whole table <span>▾</span></summary><table><thead><tr><th></th>'+CP.map(function(p){return '<th>'+p.n+'</th>'}).join('')+'</tr></thead><tbody>'+CATTR.map(function(t){ if(t[0]==='g') return '<tr><th colspan="5" style="background:var(--ink);color:var(--paper)">'+t[1]+'</th></tr>'; return '<tr><th>'+t[1]+'</th>'+CP.map(function(p){return '<td class="'+(cletter(p.id)?'sel':'')+'" style="--pc:'+COL[p.c]+'">'+cdisp(p,t)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></details>';
  return chead()+rt+d+tb;
}

function cmpDraw(){ var s=document.querySelectorAll('.cmp3'); [].forEach.call(s,function(x){x.innerHTML=cmpHTML()}) }
document.addEventListener('click',function(e){ var p=e.target.closest('[data-cpick]'); if(p){ e.preventDefault(); ctoggle(+p.getAttribute('data-cpick')); cmpDraw() } });
document.addEventListener('toggle',function(e){ if(e.target.classList&&e.target.classList.contains('full3')) CS.open=e.target.open },true);

var CH='<svg class="ch" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 14l36 36-36 36"/></svg>';
function bx(n){return '<i class="bx" style="--img:var(--b'+n+')"></i>'}
function P(id){return cbyId(id)}
function meter(v){return '<span class="mv"><span class="n">'+v+'</span><span class="mt" style="--lv:'+v+'"><i></i><b></b></span></span>'}
function cta(txt,inv,attr){return '<button type="button" class="cta'+(inv?' inv':'')+'" '+(attr||'data-open')+'>'+txt+CH+'</button>'}

/* ---------- compare entry options ---------- */
var T=[];
T[0]='<div class="stage t1"><div><p class="kk"><b>NM 05</b><span class="jp">比較</span><span>Compare</span></p><h2 class="it">Not sure which tin?</h2><p class="lead">Put two matchas side by side: taste, body, foam and the price per bowl.</p>'+cta('Compare our matcha')+'</div>'
 +'<div class="pair">'
 +[1,3].map(function(id,i){var p=P(id); return '<div class="pt" style="--pc:'+COL[p.c]+'"><span class="ring on">'+'AB'[i]+'</span>'+bx(p.box)+'<h3 class="nm it">'+p.n+'</h3><small>'+CTYN[p.ty][0]+' '+CTYN[p.ty][1]+'</small></div>'}).join('')
 +'</div></div>';
T[1]='<div class="stage t2"><div class="hd"><div><p class="kk"><b>NM 05</b><span class="jp">比較</span><span>Compare</span></p><h2 class="it">Which one is yours?</h2><p>Four matchas on one line. Pick any two and see how they differ.</p></div>'+cta('Compare our matcha')+'</div>'
 +'<div class="route">'+CP.map(function(p){var on=(p.id===1?'A':(p.id===3?'B':'')); return '<button type="button" data-open="'+p.id+'" style="--pc:'+COL[p.c]+'"><span class="ring'+(on?' on':'')+'">'+on+'</span><span class="nm it">'+p.n+'</span><small>'+CTYN[p.ty][1]+' '+CTYN[p.ty][0]+'</small></button>'}).join('')+'</div>'
 +'<p class="hint">Tap a station to start from it</p></div>';
function peekRows(){
  var rows=[['Sweet',0],['Umami',1],['Bitter',3]];
  var h='<div class="rw"><b></b>'+CP.map(function(p){return '<div class="hh" style="--pc:'+COL[p.c]+'">'+bx(p.box)+'<span class="nm it">'+p.n+'</span></div>'}).join('')+'</div>';
  rows.forEach(function(r){h+='<div class="rw"><b>'+r[0]+'</b>'+CP.map(function(p){return '<div style="--pc:'+COL[p.c]+'">'+meter(p.t[r[1]])+'</div>'}).join('')+'</div>'});
  h+='<div class="rw"><b>Per bowl</b>'+CP.map(function(p){return '<div style="font-weight:700">₪'+p.pb+'</div>'}).join('')+'</div>';
  return h;
}
T[2]='<div class="stage t3"><div class="hd"><div><p class="kk"><b>NM 05</b><span class="jp">比較</span><span>Compare</span></p><h2 class="it">Compare our matcha</h2></div><p>A first look at the table. The full one has 14 rows and lets you put two tins side by side.</p></div>'
 +'<div class="peek">'+peekRows()+'</div><div class="band"><span>+ 10 more rows: origin, cultivar, body, foam, how to prepare</span>'+cta('See the full table',true)+'</div></div>';
T[3]='<div class="t4"><div class="big" aria-hidden="true">比較</div><div><p class="kk inv"><b>NM 05</b><span>Compare</span></p><h2 class="it">Compare our matcha</h2><ol><li><b>01</b><span>Taste</span> sweet, umami, grassy, bitter</li><li><b>02</b><span>Body and foam</span> thin and frothy, or thick</li><li><b>03</b><span>Price per bowl</span> the same tin, in bowls</li></ol></div>'+cta('Compare',true)+'</div>';

/* ---------- filter options ---------- */
var ITEMS=CP.map(function(p){return {id:p.id,n:p.n,ty:p.ty,box:p.box,price:p.price,t:p.t,latte:p.latte==='Yes'}}).concat([
  {id:5,n:'Tasting trio',ty:'s',box:1,price:249,t:null,latte:false},{id:6,n:'Starter ritual set',ty:'s',box:2,price:329,t:null,latte:false}]);
var TASTE=['Sweet','Umami','Grassy','Bitter'];
var F={f1:{ty:'all',latte:false},f2:{use:''},f3:{tp:-1},f4:{ty:'',taste:'',use:'',price:''}};
function top2(i){return ITEMS.filter(function(x){return x.t}).sort(function(a,b){return b.t[i]-a.t[i]||a.id-b.id}).slice(0,2).map(function(x){return x.id})}
function match(k,x){
  var s=F[k];
  if(k==='f1') return (s.ty==='all'||x.ty===s.ty)&&(!s.latte||x.latte);
  if(k==='f2'){ if(!s.use) return true; if(s.use==='daily') return x.ty==='u'; if(s.use==='latte') return x.latte; if(s.use==='thick') return x.ty==='k'; return true }
  if(k==='f3'){ return s.tp<0||(x.t&&top2(s.tp).indexOf(x.id)>-1) }
  if(k==='f4'){
    if(s.ty&&x.ty!==s.ty) return false;
    if(s.taste!==''&&!(x.t&&x.t[+s.taste]>=3)) return false;
    if(s.use==='daily'&&x.ty!=='u') return false; if(s.use==='latte'&&!x.latte) return false; if(s.use==='thick'&&x.ty!=='k') return false; if(s.use==='gift'&&x.ty!=='s') return false;
    if(s.price==='lo'&&x.price>=150) return false; if(s.price==='hi'&&x.price<150) return false;
    return true;
  }
}
function res(k){
  var n=0, best=(k==='f3'&&F.f3.tp>-1)?top2(F.f3.tp):[];
  var h=ITEMS.map(function(x){var m=match(k,x); if(m) n++; return '<span class="ri'+(m?'':' off')+(best.indexOf(x.id)>-1?' best':'')+'">'+bx(x.box)+x.n+'</span>'}).join('');
  return '<div class="res"><span class="cnt">The grid would show '+n+' of '+ITEMS.length+'</span>'+h+'</div>';
}
var chipsTy=[['all','All',''],['u','Usucha','薄茶'],['k','Koicha','濃茶'],['s','Sets','セット']];
function f1(){var s=F.f1; return '<div class="stage fx"><div class="f1">'+chipsTy.map(function(c){var n=ITEMS.filter(function(x){return c[0]==='all'||x.ty===c[0]}).length; return '<button type="button" class="cp" data-f="f1" data-ty="'+c[0]+'" aria-pressed="'+(s.ty===c[0])+'">'+c[1]+(c[2]?'<span class="jp">'+c[2]+'</span>':'')+'<small>'+n+'</small></button>'}).join('')
  +'<div class="sp"><button type="button" class="cp chk" data-f="f1" data-latte="1" aria-pressed="'+s.latte+'"><i></i>Good in a latte</button></div></div>'+res('f1')+'</div>'}
var USES=[['daily','日','A daily bowl','Thin, frothy, easy'],['latte','ラ','A latte','Sweet, mixes well'],['thick','濃','Thick tea','Slow, deep, glossy']];
function f2(){var s=F.f2; return '<div class="stage fx"><div class="f2"><p class="q it">I want to make…</p><div class="uses">'+USES.map(function(u){return '<button type="button" class="use" data-f="f2" data-use="'+u[0]+'" aria-pressed="'+(s.use===u[0])+'"><span class="k">'+u[1]+'</span><span><b>'+u[2]+'</b><small>'+u[3]+'</small></span></button>'}).join('')+'</div></div>'+res('f2')+'</div>'}
function f3(){var s=F.f3; return '<div class="stage fx"><div class="f3"><p class="q it">Closest to my taste</p>'+TASTE.map(function(t,i){var avg=Math.round(CP.reduce(function(a,p){return a+p.t[i]},0)/CP.length); var d=''; for(var q=1;q<=5;q++) d+='<i'+(q<=avg?' class="o"':'')+'></i>'; return '<button type="button" class="tp" data-f="f3" data-tp="'+i+'" aria-pressed="'+(s.tp===i)+'"><b>'+t+'</b><span class="dots">'+d+'</span></button>'}).join('')+'<button type="button" class="clr" data-f="f3" data-tp="-1">Clear</button></div>'+res('f3')+'</div>'}
function opt(list,val){return list.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===val?' selected':'')+'>'+o[1]+'</option>'}).join('')}
function f4(){var s=F.f4, n=ITEMS.filter(function(x){return match('f4',x)}).length;
  return '<div class="stage fx"><div class="f4">'
  +'<label><span>Type</span><select data-f="f4" data-k="ty">'+opt([['','All types'],['u','Usucha 薄茶'],['k','Koicha 濃茶'],['s','Sets セット']],s.ty)+'</select></label>'
  +'<label><span>Taste</span><select data-f="f4" data-k="taste">'+opt([['','Any taste'],['0','Sweet'],['1','Umami'],['2','Grassy'],['3','Bitter']],s.taste)+'</select></label>'
  +'<label><span>For</span><select data-f="f4" data-k="use">'+opt([['','Anything'],['daily','A daily bowl'],['latte','Lattes'],['thick','Thick tea'],['gift','A gift']],s.use)+'</select></label>'
  +'<label><span>Price</span><select data-f="f4" data-k="price">'+opt([['','Any price'],['lo','Under ₪150'],['hi','₪150 and up']],s.price)+'</select></label>'
  +'<div class="out"><b>'+n+' products</b><button type="button" data-f="f4" data-reset="1">Reset</button></div></div>'+res('f4')+'</div>'}
var FN={f1:f1,f2:f2,f3:f3,f4:f4};

/* ---------- the options page ---------- */
var TL=[['Two tins, one question','A tall headline, two tins joined by the line, one button.'],['The line','The four matchas as stations on the line. A station opens the compare with it already picked.'],['A peek at the table','A cut-off piece of the real table. The ink strip under it carries the button.'],['The ink band','A dark band that clearly ends the grid. Big 比較, three reasons, one button.']];
var FL=[['Ticket chips','One row. Type chips, plus a latte switch. The smallest option.'],['What are you making?','Three questions in plain words instead of a menu. Good for newcomers.'],['Closest to my taste','Pick a taste and the two nearest matchas are marked. No product knowledge needed.'],['Departures board','A dark board with four drop-downs: type, taste, use, price. The most complete.']];
var h='<section class="top"><div><h1 class="it">Compare entry and filter</h1><p>The compare section moves out of the page. In its place: a short section with a button. Below, four ways to filter before the collections. All data is SAMPLE.</p></div><div class="dest"><span>The button opens</span><div class="seg"><button type="button" data-mode="popup" aria-pressed="true">A popup</button><button type="button" data-mode="page" aria-pressed="false">Its own page</button></div></div></section>';
h+='<section class="part"><div class="ph"><b>PART 1</b><h2 class="it">The compare entry</h2></div><p class="pd">It sits after the grid, where the old compare section was. Press any button to see what it opens, then switch between a popup and a page above.</p>'
 +T.map(function(t,i){return '<div class="fr"><div class="lab"><b>'+(i+1)+'</b><h3 class="it">'+TL[i][0]+'</h3><span>'+TL[i][1]+'</span></div>'+t+'</div>'}).join('')+'</section>';
h+='<section class="part"><div class="ph"><b>PART 2</b><h2 class="it">The filter</h2></div><p class="pd">A small section above the matcha collections. Each option is live: the strip under it shows which products the grid would keep.</p>'
 +['f1','f2','f3','f4'].map(function(k,i){return '<div class="fr" id="w-'+k+'"><div class="lab"><b>'+String.fromCharCode(65+i)+'</b><h3 class="it">'+FL[i][0]+'</h3><span>'+FL[i][1]+'</span></div><div class="slot">'+FN[k]()+'</div></div>'}).join('')+'</section>';
h+='<div class="cw popup" id="cw"><div class="scrim" data-close></div><div class="sheet"><button type="button" class="xbtn" data-close>Close ✕</button><div class="pgbar"><button type="button" class="bk" data-close>'+CH+'Back to the shop</button><span class="crumb">Shop / Compare our matcha</span><span class="url">nomimatcha.co.il/shop/compare</span></div><div class="cmp3"></div></div></div>';
document.getElementById('app').innerHTML=h;

/* ---------- behaviour ---------- */
var MODE='popup', lastBtn=null;
function openCmp(a){
  if(a){ CS.sel=[a, a===CP.length?a-1:a+1] ; if(CS.sel[1]<CS.sel[0]) CS.sel.reverse() }
  var w=document.getElementById('cw'); w.className='cw '+MODE+' on'; w.querySelector('.cmp3').innerHTML=cmpHTML(); w.querySelector('.sheet').scrollTop=0; document.body.style.overflow='hidden';
}
function closeCmp(){ document.getElementById('cw').className='cw '+MODE; document.body.style.overflow=''; if(lastBtn) lastBtn.focus() }
document.addEventListener('click',function(e){
  var m=e.target.closest('[data-mode]'); if(m){ MODE=m.getAttribute('data-mode'); [].forEach.call(document.querySelectorAll('[data-mode]'),function(b){b.setAttribute('aria-pressed',b===m)}); return }
  var o=e.target.closest('[data-open]'); if(o){ lastBtn=o; var v=o.getAttribute('data-open'); openCmp(v?+v:0); return }
  if(e.target.closest('[data-close]')){ closeCmp(); return }
  var f=e.target.closest('button[data-f]'); if(f){
    var k=f.getAttribute('data-f'), s=F[k];
    if(k==='f1'){ if(f.hasAttribute('data-latte')) s.latte=!s.latte; else s.ty=f.getAttribute('data-ty') }
    if(k==='f2'){ var u=f.getAttribute('data-use'); s.use=(s.use===u?'':u) }
    if(k==='f3'){ var t=+f.getAttribute('data-tp'); s.tp=(s.tp===t?-1:t) }
    if(k==='f4'&&f.hasAttribute('data-reset')) F.f4={ty:'',taste:'',use:'',price:''};
    document.querySelector('#w-'+k+' .slot').innerHTML=FN[k]();
  }
});
document.addEventListener('change',function(e){ var s=e.target.closest('select[data-f]'); if(s){ F.f4[s.getAttribute('data-k')]=s.value; document.querySelector('#w-f4 .slot').innerHTML=f4(); var nx=document.querySelector('#w-f4 select[data-k="'+s.getAttribute('data-k')+'"]'); if(nx) nx.focus() } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&document.getElementById('cw').classList.contains('on')) closeCmp() });
})();

</script>
</body>
</html>
