/* Hero options for concept 2 (The Matcha Line). Same composition in all four: text on the start side (title, short
   paragraph, CTA), a peek at the tin collection on the other side, on the red screen. They differ in layout and in the
   entrance animation. Pick one and it moves into home-matcha-line.html. */
:root{
  --paper:#fffefb; --paper-muted:#f5efe3; --ink:#1a2c27; --line-strong:rgba(26,44,39,.34);
  --red:#ce2527; --indigo:#336b97; --matcha:#59823a;
  --font:"Degular","Adapter Hebrew Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gutter:clamp(20px,3.4vw,50px); --sw-h:56px;
  --th:clamp(210px,62vh,640px);                 /* tin height */
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0; background:var(--ink); color:var(--paper); font-family:var(--font); line-height:1.5; -webkit-font-smoothing:antialiased}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--paper); outline-offset:3px}

/* ---------- option switcher (review tool, not part of the site) ---------- */
.sw{position:sticky; top:0; z-index:300; height:var(--sw-h); display:flex; align-items:center; gap:8px; padding-inline:var(--gutter); background:var(--ink); border-block-end:1px solid rgba(255,254,251,.2)}
.sw b{font-size:13px; letter-spacing:.08em; text-transform:uppercase; opacity:.6; margin-inline-end:8px; white-space:nowrap}
.sw button.opt{height:36px; padding-inline:14px; border-radius:999px; border:2px solid rgba(255,254,251,.4); font-size:14px; font-weight:600; white-space:nowrap}
.sw button.opt[aria-pressed=true]{background:var(--paper); color:var(--ink); border-color:var(--paper)}
.sw .desc{font-size:13px; opacity:.75; margin-inline-start:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.sw .replay{margin-inline-start:auto; height:36px; padding-inline:14px; border-radius:999px; background:var(--red); font-size:14px; font-weight:700; white-space:nowrap}

/* ---------- stage = the red screen ---------- */
.stage{display:none; position:relative; overflow:hidden; background:var(--red); color:var(--paper); min-height:max(640px,calc(100svh - var(--sw-h)))}
.stage.on{display:flex; flex-direction:column}

/* nav (same as the concept shell, white logo on red) */
.topbar{background:var(--ink); color:var(--paper); text-align:center; padding:11px 24px; font-size:14px; font-weight:600; line-height:1.3; letter-spacing:.04em; text-transform:uppercase}
.nav{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; height:84px; padding-inline:var(--gutter); position:relative; z-index:5}
.nav .brand img{display:block; height:46px; width:auto}
.nav .burger{display:none; width:40px; height:40px; place-items:center; margin-inline-start:-8px}
.nav .burger svg{width:26px; height:26px; fill:none; stroke:var(--paper); stroke-width:1.5; stroke-linecap:square}
.pill{border:2px solid var(--line-strong); border-radius:999px; background:var(--paper); color:var(--ink); padding:3px}
.pill ul{display:flex; gap:2px; margin:0; padding:0; list-style:none}
.pill a{display:flex; align-items:center; height:34px; padding-inline:16px; border-radius:999px; font-size:15px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; white-space:nowrap}
.tools{display:flex; align-items:center; gap:8px; justify-self:end}
.ic{display:grid; place-items:center; width:44px; height:44px; border-radius:999px; background:var(--paper); color:var(--ink); border:2px solid var(--line-strong)}
.ic svg,.cart svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.cart{display:inline-flex; align-items:center; gap:8px; height:44px; padding-inline:14px 16px; border-radius:999px; background:var(--ink); color:var(--paper); font-size:15px; font-weight:600}

/* hero grid: text | collection */
.hero{flex:1; display:grid; grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr); align-items:stretch; gap:clamp(16px,3vw,48px); padding-inline:var(--gutter); position:relative; z-index:2}
.copy{align-self:center; padding-block:clamp(16px,4vh,48px) clamp(24px,7vh,80px); max-width:640px}
.eyebrow{display:inline-flex; align-items:center; gap:10px; height:32px; padding-inline:14px; border:2px solid var(--paper); border-radius:999px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin:0 0 clamp(16px,3vh,28px)}
.eyebrow i{width:8px; height:8px; border-radius:50%; background:var(--paper); display:block}
h1{margin:0; font-size:clamp(42px,5.7vw,92px); line-height:.98; font-weight:700; letter-spacing:-.025em}
.ln{display:block; overflow:hidden; padding-block-end:.08em; margin-block-end:-.08em}
.ln>span{display:block}
.lede{margin:clamp(18px,3.4vh,32px) 0 clamp(22px,4vh,40px); font-size:clamp(17px,1.5vw,21px); line-height:1.45; max-width:34ch}
.cta{display:inline-flex; align-items:center; gap:14px; height:58px; padding-inline:30px 24px; border-radius:999px; background:var(--paper); color:var(--ink); font-size:17px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; transition:background-color .15s, color .15s}
.cta svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:square; transition:transform .2s}
.cta:hover svg{transform:translateX(4px)}
:dir(rtl) .cta svg{transform:scaleX(-1)}
.cta:hover{background:var(--ink); color:var(--paper)}

/* collection (shelf) */
.shelf{container-type:inline-size; margin-inline-end:calc(var(--gutter)*-1); position:relative; align-self:stretch; display:flex; align-items:flex-end; justify-content:center; padding-block-end:var(--pb,0px); min-height:calc(var(--th)*1.2)}
.tin{--h:min(var(--th),var(--cap,42cqw)); position:relative; flex:none; margin:0}
.tin img{display:block; height:var(--h); width:auto; user-select:none; -webkit-user-drag:none}
.chip,.dot,.ring,.floor,.line{display:none}

/* text entrance (shared) */
.stage.play .ln>span{animation:up .9s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(.15s + var(--l)*.11s)}
.stage.play .eyebrow{animation:fade .6s ease-out both; animation-delay:.05s}
.stage.play .lede{animation:fade .8s ease-out both; animation-delay:.62s}
.stage.play .cta{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both; animation-delay:.78s}
.stage:not(.play) .ln>span{transform:translateY(112%)}
.stage:not(.play) .eyebrow,.stage:not(.play) .lede,.stage:not(.play) .cta{opacity:0}
@keyframes up{from{transform:translateY(112%)}to{transform:none}}
@keyframes fade{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.8)}to{opacity:1; transform:none}}

/* ===== Combined: Lineup (tins overlap in a row, middle one tallest) + Route (a line draws across, tins appear on it) ===== */
.stage{--pb:92px}
.hero{position:relative}
.shelf{--pb:92px; overflow:visible; padding-inline:2%}
.tin{--cap:47cqw; margin-inline:-3.5%}
.tin:nth-of-type(2){z-index:2}
.tin:nth-of-type(2) img{height:calc(var(--h)*1.16)}
.tin img{translate:0 0; transition:translate .3s cubic-bezier(.2,.9,.3,1.2); clip-path:inset(100% 0 0 0)}
.tin:hover img{translate:0 -10px}
.copy{padding-block-end:calc(var(--pb) + 28px)}

/* the line: full width, from the left edge to the right edge, with an arrow tip */
.line{display:block; position:absolute; inset-inline:calc(var(--gutter)*-1); bottom:calc(var(--pb) - 3px); height:6px; background:var(--paper); transform-origin:0 50%; z-index:1}
.line::after{content:""; position:absolute; inset-inline-end:2px; top:50%; width:18px; height:18px; border-top:6px solid var(--paper); border-right:6px solid var(--paper); transform:translateY(-50%) rotate(45deg)}
.route{display:none}
.tin{z-index:2}
.tin:nth-of-type(2){z-index:3}

/* stations: a dot under each tin, a sign below it */
.dot{display:block; position:absolute; inset-inline-start:50%; bottom:-14px; width:28px; height:28px; margin-inline-start:-14px; border-radius:50%; background:var(--paper); border:6px solid var(--ink); z-index:4}
.chip{display:flex; align-items:center; gap:8px; position:absolute; inset-inline-start:50%; top:calc(100% + 30px); transform:translateX(-50%); white-space:nowrap; background:var(--paper); color:var(--ink); border-radius:2px; padding:5px 10px 5px 5px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; z-index:4}
:dir(rtl) .chip{transform:translateX(50%)}
.chip b{display:grid; place-items:center; min-width:26px; height:22px; background:var(--ink); color:var(--paper); border-radius:2px; font-size:12px}

/* platform sign (option 3 only) */
.sign{display:none}
[data-o=c] .sign{display:block; position:absolute; inset-inline:8% 8%; top:clamp(4px,3vh,32px); z-index:6; background:var(--paper); color:var(--ink); border-radius:2px; overflow:hidden}
.sign-top{display:flex; align-items:center; gap:14px; padding:12px 18px}
.sign-top b{display:grid; place-items:center; min-width:58px; height:42px; padding-inline:8px; background:var(--matcha); color:var(--paper); border-radius:6px; font-size:19px; font-weight:700; letter-spacing:.02em}
.sign-top .jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; font-size:clamp(22px,2.3vw,32px); font-weight:700; line-height:1}
.sign-top .en{margin-inline-start:auto; font-size:clamp(13px,1.2vw,17px); font-weight:700; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.sign-bot{display:flex; justify-content:space-between; gap:12px; padding:10px 18px 11px; background:var(--indigo); color:var(--paper); border-top:5px solid var(--matcha); font-size:clamp(13px,1.2vw,16px); font-weight:700; letter-spacing:.04em; white-space:nowrap}
.sign-bot span:first-child::before{content:"\2190  "}
.sign-bot span:last-child::after{content:"  \2192"}

/* option 2: thick route with a 45-degree step (cased line, as on the earlier hero background) */
[data-o=b]{--pb:calc(100vw / 1440 * 153)}
[data-o=b] .shelf{--pb:calc(100vw / 1440 * 153)}
[data-o=b] .line{display:none}
[data-o=b] .route{display:block; position:absolute; inset-inline-start:0; bottom:0; width:100%; height:auto; z-index:1; pointer-events:none}
[data-o=b] .route path{fill:none; stroke-linejoin:miter; stroke-dasharray:1; stroke-dashoffset:0}
[data-o=b] .dot{bottom:-27px}
[data-o=b] .chip{top:calc(100% + 46px)}

/* ----- entrance: the line draws, the tins come up out of it one by one, then the sign drops ----- */
.stage.play .line{animation:draw 1.5s cubic-bezier(.65,.05,.35,1) both; animation-delay:.1s}
.stage:not(.play) .line{transform:scaleX(0)}
.stage.play [data-o=b] .x, .stage.play .route path{animation:trace 1.7s cubic-bezier(.65,.05,.35,1) both; animation-delay:.1s}
.stage:not(.play) .route path{stroke-dashoffset:1}
.stage.play .dot{animation:dotpop .5s cubic-bezier(.2,.9,.3,1.5) both; animation-delay:calc(.85s + var(--i)*.2s)}
.stage.play .tin img{animation:emerge .95s cubic-bezier(.2,.9,.3,1.04) both; animation-delay:calc(1s + var(--i)*.2s)}
.stage.play .chip{animation:fade .5s ease-out both; animation-delay:calc(1.55s + var(--i)*.2s)}
.stage.play[data-o=c] .sign{animation:signdrop 1.1s linear both; animation-delay:1.9s}
.stage:not(.play) .dot,.stage:not(.play) .chip,.stage:not(.play) .sign{opacity:0}
@keyframes draw{from{transform:scaleX(0)}to{transform:none}}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes dotpop{from{transform:scale(0)}to{transform:none}}
@keyframes emerge{from{clip-path:inset(100% 0 0 0); transform:translateY(46px)}to{clip-path:inset(-30% -30% 0 -30%); transform:none}}
@keyframes signdrop{
  0%{transform:translateY(-170%); animation-timing-function:cubic-bezier(.55,0,.9,.5)}
  55%{transform:none; animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  72%{transform:translateY(-9%); animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  88%{transform:none; animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  94%{transform:translateY(-2%)}
  100%{transform:none}}

@media (max-width:1180px){
  .nav{display:flex; justify-content:space-between}
  .pill{display:none}
  .nav .burger{display:grid; order:-1}
  .tools{margin-inline-start:auto}
}
@media (max-width:900px){
  :root{--th:clamp(150px,27vh,300px)}
  .hero{grid-template-columns:1fr; gap:0}
  .copy{padding-block:16px 8px}
  .shelf{min-height:calc(var(--th)*1.3)}
  .sw .desc{display:none}
  [data-o=b],[data-o=b] .shelf{--pb:70px}
  [data-o=b] .line{display:block}
  [data-o=b] .route{display:none !important}
  [data-o=b] .dot{bottom:-14px}
  .sign-top .en{display:none}
}
@media (max-width:640px){
  .nav{height:72px} .nav .brand img{height:32px} .ic{width:36px; height:36px} .cart{height:36px; padding-inline:11px 13px; font-size:14px}
  .topbar{font-size:12px; padding:9px 16px}
  .sw b{display:none}
  .sw button.opt{padding-inline:10px}
}
@media (prefers-reduced-motion:reduce){
  .stage .ln>span,.stage .eyebrow,.stage .lede,.stage .cta,.stage .tin,.stage .tin img,.stage .dot,.stage .chip,.stage .line,.stage .floor{animation:none !important; opacity:1 !important; transform:none !important}
  [data-o=b] .tin{transform:translateX(calc(-50% + var(--x))) rotate(var(--r)) !important}
  [data-o=c] .tin{transform:translateY(var(--dy)) rotate(var(--r)) !important}
}
</style>
</head>

<main id="stages"></main>

<script>
(function(){
  var H=['Your Matcha','Journey','Starts Here'];
  var OPTS=[
    {k:'a',d:'A route line draws across the hero; the tins come up out of it, each at its own station with a sign.',h:H},
    {k:'b',d:'A thick cased route with a 45-degree step draws in; the tins stand on the raised stretch.',h:H},
    {k:'c',d:'The line and tins, then a platform sign drops in above them: Aichi to Tel Aviv.',h:H}
  ];
  var host=document.getElementById('stages'), navT=document.getElementById('nav-t'), heroT=document.getElementById('hero-t'),
      btns=[].slice.call(document.querySelectorAll('.opt')), desc=document.getElementById('desc'), cur=0, stages=[];
  OPTS.forEach(function(o,i){
    var s=document.createElement('section'); s.className='stage'; s.setAttribute('data-o',o.k); s.setAttribute('aria-label','Hero option '+o.k.toUpperCase());
    s.appendChild(navT.content.cloneNode(true));
    var hero=heroT.content.cloneNode(true), h1=hero.querySelector('h1');
    h1.setAttribute('aria-label',o.h.join(' '));
    h1.innerHTML=o.h.map(function(t,n){return '<span class="ln" aria-hidden="true"><span style="--l:'+n+'">'+t+'</span></span>'}).join('');
    s.appendChild(hero); host.appendChild(s); stages.push(s);
  });
  function show(i){
    cur=i; stages.forEach(function(s,n){ s.classList.toggle('on',n===i); s.classList.remove('play'); });
    btns.forEach(function(b,n){ b.setAttribute('aria-pressed',n===i?'true':'false'); });
    desc.textContent=OPTS[i].d;
    try{ history.replaceState(null,'','?o='+(i+1)); }catch(e){}
    play();
  }
  function play(){ var s=stages[cur]; s.classList.remove('play'); void s.offsetWidth; s.classList.add('play'); }
  btns.forEach(function(b){ b.addEventListener('click',function(){ show(+b.getAttribute('data-i')); }); });
  document.getElementById('replay').addEventListener('click',play);
  document.addEventListener('keydown',function(e){ if(e.key>='1'&&e.key<='3') show(+e.key-1); if(e.key==='r'||e.key==='R') play(); });
  var m=/[?&]o=(\d)/.exec(location.search); show(m&&m[1]>=1&&m[1]<=3?m[1]-1:0);
})();
</script>
